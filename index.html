<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Growth Cells</title>
    <style>
      body {
        margin: 0;
        background: #111418;
        color: #e8eaed;
        font-family: system-ui, sans-serif;
      }
      #board {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .panel {
        position: fixed;
        top: 16px;
        left: 16px;
        max-width: calc(100% - 64px);
        width: 280px;
        padding: 16px;
        border-radius: 12px;
        background: rgb(17 20 24 / 0.85);
        backdrop-filter: blur(6px);
        box-shadow: 0 4px 24px rgb(0 0 0 / 0.4);
      }
      .panel h1 {
        margin: 0;
        font-size: 18px;
      }
      .panel .status {
        margin: 4px 0 12px;
        color: #4fc3a1;
        font-variant-numeric: tabular-nums;
      }
      .panel .errors {
        margin: 0 0 12px;
        padding-left: 18px;
        color: #ff8a80;
        font-size: 14px;
      }
      .panel form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .panel label {
        display: grid;
        gap: 2px;
        font-size: 12px;
        color: #9aa0a6;
      }
      .panel input {
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid #3c4043;
        border-radius: 6px;
        background: #1f2328;
        color: inherit;
        font: inherit;
        font-size: 14px;
      }
      .panel button {
        grid-column: 1 / -1;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: #4fc3a1;
        color: #111418;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
